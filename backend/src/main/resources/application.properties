spring.application.name=sre-agent

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sre_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=${DB_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.mvc.async.request-timeout=${SSE_TIMEOUT_MS:600000}

sreagent.name=bailian-sre-agent
sreagent.workspace=${AGENTSCOPE_WORKSPACE:./workspace}
sreagent.default-model=qwen3.7-plus
sreagent.sunfire-model=qwen3.7-plus
sreagent.sunfire-webhook-token=${SUNFIRE_WEBHOOK_TOKEN:}
# Sunfire MCP：启用后将自动发现并注册远端 tools 到 AgentScope Toolkit。
# PRIVATE-TOKEN 为空时保持关闭；填入后将 enabled 改为 true。
sreagent.sunfire-mcp.enabled=true
sreagent.sunfire-mcp.endpoint=https://mcp.alibaba-inc.com/sunfire-mcp/mcp
sreagent.sunfire-mcp.private-token=${SUNFIRE_MCP_PRIVATE_TOKEN:z1JcAKBQPzzC6x_jocD5}
sreagent.sunfire-mcp.timeout-seconds=60
sreagent.max-iters=10
sreagent.compaction-trigger-messages=30
sreagent.compaction-keep-messages=10
sreagent.session-lock-seconds=900
sreagent.session-lease-key-prefix=${SESSION_LEASE_KEY_PREFIX:sre:session:lease:}
# 流式续跑：事件缓冲 TTL / 心跳 / 陈旧判定 / 重连轮询间隔
sreagent.stream.key-prefix=${STREAM_KEY_PREFIX:sre:stream:}
sreagent.stream.ttl-minutes=${STREAM_TTL_MINUTES:30}
sreagent.stream.heartbeat-seconds=${STREAM_HEARTBEAT_SECONDS:5}
sreagent.stream.stale-after-seconds=${STREAM_STALE_AFTER_SECONDS:30}
sreagent.stream.poll-millis=${STREAM_POLL_MILLIS:150}
sreagent.agent-state-database=${AGENTSCOPE_STATE_DB:sre_agent}
sreagent.agent-state-table=${AGENTSCOPE_STATE_TABLE:agentscope_sessions}
sreagent.sandbox.enabled=${AONE_SANDBOX_ENABLED:true}
sreagent.sandbox.api-key=${AONE_SANDBOX_API_KEY:96f38f1b1aa5b2b8a226f715dbd6f0cf04584642}
sreagent.sandbox.template=${AONE_SANDBOX_TEMPLATE:code-interpreter}
sreagent.sandbox.timeout-minutes=${AONE_SANDBOX_TIMEOUT_MINUTES:1440}
sreagent.sandbox.renew-threshold-minutes=${AONE_SANDBOX_RENEW_THRESHOLD_MINUTES:15}
sreagent.sandbox.ready-timeout-seconds=${AONE_SANDBOX_READY_TIMEOUT_SECONDS:120}
sreagent.sandbox.connect-timeout-seconds=${AONE_SANDBOX_CONNECT_TIMEOUT_SECONDS:30}
sreagent.sandbox.work-dir=${AONE_SANDBOX_WORK_DIR:/workspace}
sreagent.sandbox.max-sandboxes=${AONE_SANDBOX_MAX_COUNT:5}
sreagent.sandbox.key-prefix=${AONE_SANDBOX_KEY_PREFIX:sre:sandbox:}
sreagent.sandbox.create-lock-seconds=${AONE_SANDBOX_CREATE_LOCK_SECONDS:30}
sreagent.sandbox.exec-timeout-seconds=${AONE_SANDBOX_EXEC_TIMEOUT_SECONDS:120}
sreagent.sandbox.max-output-chars=${AONE_SANDBOX_MAX_OUTPUT_CHARS:20000}
sreagent.models[qwen3.7-plus].display-name=Qwen3.7 Plus
sreagent.models[qwen3.7-plus].model-id=dashscope:qwen3.7-plus
sreagent.models[qwen3.7-plus].enabled=true
sreagent.models[qwen3.8-max].display-name=Qwen3.8 Max
sreagent.models[qwen3.8-max].model-id=dashscope:qwen3.8-max
sreagent.models[qwen3.8-max].enabled=true

# Contextlab 外部 skill 市场
sreagent.contextlab.enabled=${CONTEXTLAB_ENABLED:true}
sreagent.contextlab.endpoint=${CONTEXTLAB_ENDPOINT:https://contextlab.alibaba-inc.com}
sreagent.contextlab.token=${AONE_CONTEXTLAB_TOKEN:z1JcAKBQPzzC6x_jocD5}
sreagent.contextlab.include-public=${CONTEXTLAB_INCLUDE_PUBLIC:true}
sreagent.contextlab.scopes=${CONTEXTLAB_SCOPES:}
sreagent.contextlab.builtin-platform-resource-id=${CONTEXTLAB_BUILTIN_PLATFORM_RESOURCE_ID:}
sreagent.contextlab.catalog-cache-minutes=5
sreagent.contextlab.package-cache-minutes=30
sreagent.contextlab.page-size=100
sreagent.contextlab.max-skills=1000

# 只加载/同步指定的 skill；留空表示不过滤
sreagent.contextlab.include-skills=dashscope-alert-diagnosis,sre-bailian-data-query
# sreagent.contextlab.exclude-skills=skill-c
